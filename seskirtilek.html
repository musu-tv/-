<script>
  const videos = [
    { title: "___  1  SEZONAS ___", type: "=", src: "=" },
    { title: "1 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100158" },
    { title: "2 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100159" },
    { title: "3 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100160" },
    { title: "4 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100161" },
    { title: "5 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100162" },
    { title: "6 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100163" },
    { title: "7 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100164" },
    { title: "8 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100165" },
    { title: "9 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100166" },
    { title: "10 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100167" },
    { title: "11 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100168" },
    { title: "12 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100169" },
    { title: "13 serija", type: "iframe", src: "https://video.sibnet.ru/shell.php?videoid=6100170" }
  ];

  const videoEl = document.getElementById("video-player");
  const iframeEl = document.getElementById("iframe-player");
  const playlistEl = document.getElementById("playlist");
  const playerContainer = document.getElementById("player-container");
  const fullscreenBtn = document.getElementById("fullscreenBtn");
  const preloaderEl = document.getElementById("preloader");

  let currentIndex = 0;

  function loadVideo(index) {
    currentIndex = index;
    const item = videos[index];

    // slepiam pradinį paveikslėlį
    preloaderEl.style.display = "none";

    videoEl.style.display = "none";
    iframeEl.style.display = "none";

    if (item.type === "mp4") {
      iframeEl.src = "";
      videoEl.src = item.src;
      videoEl.style.display = "block";
      videoEl.play();
    } else if (item.type === "iframe") {
      videoEl.pause();
      videoEl.src = "";
      iframeEl.src = item.src;
      iframeEl.style.display = "block";
    }
  }

  // sugeneruojam playlistą
  videos.forEach((v, i) => {
    const div = document.createElement("div");
    div.textContent = v.title;
    div.onclick = () => {
      loadVideo(i);
      showPlaylist();
    };
    playlistEl.appendChild(div);
  });

  // paleidžiam pirmą
  // paliekam preloader kol paspaudžiama playlist elementas
  // jei nori automatiškai paleisti pirmą, gali įjungti loadVideo(0) iškart
  // loadVideo(0);

  // auto-sekantis tik mp4 atveju
  videoEl.addEventListener("ended", () => {
    if (currentIndex < videos.length - 1) {
      loadVideo(currentIndex + 1);
    }
  });

  // playlisto rodymo/slepimo logika
  let hideTimeout;
  function showPlaylist() {
    playlistEl.style.opacity = "1";
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      playlistEl.style.opacity = "0";
    }, 6000);
  }
  playerContainer.addEventListener("mousemove", showPlaylist);
  showPlaylist();
  // fullscreen
  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) playerContainer.requestFullscreen();
    else document.exitFullscreen();
  });

</script>
